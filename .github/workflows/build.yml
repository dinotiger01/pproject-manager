name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: json
        shell: pwsh
        run: |
          vcpkg install nlohmann-json:x64-windows

      - name: Verify json
        shell: pwsh
        run: |
          $header = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include/nlohmann/json.hpp"
          
          if (!(Test-Path $header)) {
            Write-Error "nlohmann/json.hpp was not found at $header"
            exit 1
          }
          
          Write-Host "Found nlohmann/json.hpp"

      - name: Configure CMake
        shell: pwsh
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build/project.exe")) {
            Write-Error "project.exe was not created"
            exit 1
          }

          Write-Host "project.exe found."

      - name: Deploy Qt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Copy-Item "build/project.exe" "release/project.exe"

          windeployqt `
            --release `
            --qmldir "$env:GITHUB_WORKSPACE/QML" `
            "release/project.exe"

      - name: Show release files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse release | Select-Object FullName

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: project-Windows
          path: release/
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            fuse3 \
            libfuse2 \
            nlohmann-json3-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Check executable
        shell: bash
        run: |
          ls -lh build/project

      - name: Find Qt qmake
        shell: bash
        run: |
          echo "Searching for qmake..."

          QMAKE_PATH="$(find "$HOME" -type f -name qmake -executable 2>/dev/null | head -n 1)"

          if [ -z "$QMAKE_PATH" ]; then
            echo "ERROR: qmake was not found"
            exit 1
          fi

          echo "Found qmake:"
          echo "$QMAKE_PATH"

          echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"

      - name: Verify qmake
        shell: bash
        run: |
          echo "QMAKE=$QMAKE"
          "$QMAKE" -v

      - name: Download linuxdeploy
        shell: bash
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy.AppImage

          chmod +x linuxdeploy.AppImage

      - name: Download Qt plugin
        shell: bash
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -O linuxdeploy-plugin-qt.AppImage

          chmod +x linuxdeploy-plugin-qt.AppImage

      - name: Prepare AppDir
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps

          cp build/project AppDir/usr/bin/project

          cp SVG/project.svg \
             AppDir/usr/share/icons/hicolor/scalable/apps/project.svg

          cat > AppDir/usr/share/applications/project.desktop << 'EOF'
          [Desktop Entry]
          Name=Project
          Exec=project
          Icon=project
          Type=Application
          Categories=Utility;
          EOF

      - name: Build AppImage
        shell: bash
        run: |
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Find AppImage
        shell: bash
        run: |
          echo "AppImage files:"
          find . -maxdepth 2 -type f -name "*.AppImage" -print

      - name: Rename AppImage
        shell: bash
        run: |
          APPIMAGE="$(find . -maxdepth 2 -type f -name "*.AppImage" | head -n 1)"

          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No AppImage was created"
            exit 1
          fi

          cp "$APPIMAGE" project-x86_64.AppImage

          chmod +x project-x86_64.AppImage

          ls -lh project-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: project-Linux-AppImage
          path: project-x86_64.AppImage

      - name: Test AppImage
        shell: bash
        run: |
          chmod +x project-x86_64.AppImage
          
          echo "Checking AppImage:"
          file project-x86_64.AppImage
          
          echo
          echo "Running AppImage:"
          ./project-x86_64.AppImage --appimage-version