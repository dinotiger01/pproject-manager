name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: json
        shell: pwsh
        run: |
          vcpkg install nlohmann-json:x64-windows

      - name: Verify json
        shell: pwsh
        run: |
          $header = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include/nlohmann/json.hpp"
          
          if (!(Test-Path $header)) {
            Write-Error "nlohmann/json.hpp was not found at $header"
            exit 1
          }
          
          Write-Host "Found nlohmann/json.hpp"

      - name: Configure CMake
        shell: pwsh
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build/project.exe")) {
            Write-Error "project.exe was not created"
            exit 1
          }

          Write-Host "project.exe found."

      - name: Deploy Qt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Copy-Item "build/project.exe" "release/project.exe"

          windeployqt `
            --release `
            --qmldir "$env:GITHUB_WORKSPACE/QML" `
            "release/project.exe"

      - name: Show release files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse release | Select-Object FullName

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: project-Windows
          path: release/
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            fuse3 \
            libfuse2 \
            nlohmann-json3-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Check executable
        shell: bash
        run: |
          ls -lh build/project

      - name: Find Qt qmake
        shell: bash
        run: |
          echo "Searching for qmake..."

          QMAKE_PATH="$(find "$HOME" -type f -name qmake -executable 2>/dev/null | head -n 1)"

          if [ -z "$QMAKE_PATH" ]; then
            echo "ERROR: qmake was not found"
            exit 1
          fi

          echo "Found qmake:"
          echo "$QMAKE_PATH"

          echo "QMAKE=$QMAKE_PATH" >> "$GITHUB_ENV"

      - name: Verify qmake
        shell: bash
        run: |
          echo "QMAKE=$QMAKE"
          "$QMAKE" -v

      - name: Download linuxdeploy and Qt plugin
        shell: bash
        run: |
          set -e
          
          echo "=== Downloading linuxdeploy ==="
          
          wget -q \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
          -O linuxdeploy.AppImage
          
          chmod +x linuxdeploy.AppImage
          
          echo "=== Checking linuxdeploy ==="
          ls -lh linuxdeploy.AppImage
          file linuxdeploy.AppImage
          
          echo
          echo "=== Downloading Qt plugin ==="
          
          wget -q \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
          -O linuxdeploy-plugin-qt.AppImage
          
          chmod +x linuxdeploy-plugin-qt.AppImage
          
          echo "=== Checking Qt plugin ==="
          ls -lh linuxdeploy-plugin-qt.AppImage
          file linuxdeploy-plugin-qt.AppImage

      - name: Verify linuxdeploy
        shell: bash
        run: |
          set -e
          
          echo "Current directory:"
          pwd
          
          echo
          echo "Files:"
          ls -lah
          
          echo
          echo "linuxdeploy:"
          ls -lh ./linuxdeploy.AppImage
          
          echo
          echo "Qt plugin:"
          ls -lh ./linuxdeploy-plugin-qt.AppImage
          
          echo
          echo "linuxdeploy version:"
          ./linuxdeploy.AppImage --version

      - name: Prepare AppDir
        shell: bash
        run: |
          set -e
          
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          
          cp build/project AppDir/usr/bin/project
          
          cp SVG/project.svg \
            AppDir/usr/share/icons/hicolor/scalable/apps/project.svg
          
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=Project' \
            'Exec=project' \
            'Icon=project' \
            'Type=Application' \
            'Categories=Utility;' \
            > AppDir/usr/share/applications/project.desktop
          
          echo "=== AppDir ==="
          find AppDir -maxdepth 5 -type f | sort

      - name: Build AppImage
        shell: bash
        env:
          QMAKE: ${{ env.QMAKE }}
          QML_SOURCES_PATHS: ${{ github.workspace }}/QML
        run: |
          set -e
          
          echo "=== Before linuxdeploy ==="
          pwd
          ls -lh ./linuxdeploy.AppImage
          ls -lh ./linuxdeploy-plugin-qt.AppImage
          
          rm -f ./*.AppImage
          
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/project.desktop \
            --plugin qt \
            --output appimage
          
          echo "=== Generated AppImage ==="
          find . -maxdepth 2 -type f -name "*.AppImage" -print
      - name: Inspect AppDir
        shell: bash
        run: |
          echo "=== Current directory ==="
          pwd
          
          echo
          echo "=== AppDir ==="
          ls -la AppDir
          
          echo
          echo "=== AppDir files ==="
          find AppDir -maxdepth 5 -type f | sort | head -500
          
          echo
          echo "=== QtQuick modules ==="
          find AppDir -type f | grep -i "QtQuick" || true
          
          echo
          echo "=== Controls ==="
          find AppDir -type f | grep -i "controls" || true
          
          echo
          echo "=== Qt platform plugins ==="
          find AppDir -type f | grep -E "platforms|wayland|xcb" || true

      - name: Find AppImage
        shell: bash
        run: |
          echo "=== AppImages ==="
          find . -maxdepth 2 -type f -name "*.AppImage" -print

      - name: Find project AppImage
        shell: bash
        run: |
          FOUND=""
          
          for APP in ./*.AppImage; do
            [ -f "$APP" ] || continue
          
            echo "Checking $APP"
          
            rm -rf test-appimage
            mkdir test-appimage
          
            cd test-appimage
          
            "$GITHUB_WORKSPACE/$APP" \
              --appimage-extract >/dev/null
          
            if [ -f squashfs-root/usr/bin/project ]; then
              echo "FOUND: $APP"
              FOUND="$APP"
          
              cd "$GITHUB_WORKSPACE"
              break
            fi
          
            cd "$GITHUB_WORKSPACE"
          done
          
          if [ -z "$FOUND" ]; then
            echo "ERROR: No AppImage containing project was found."
            exit 1
          fi
          
          cp "$FOUND" "$GITHUB_WORKSPACE/project-x86_64.AppImage"
          
          chmod +x "$GITHUB_WORKSPACE/project-x86_64.AppImage"
          
          echo "=== Final AppImage ==="
          ls -lh "$GITHUB_WORKSPACE/project-x86_64.AppImage"

      - name: Inspect final AppImage
        shell: bash
        run: |
          rm -rf inspect
          mkdir inspect
          cd inspect
          
          "$GITHUB_WORKSPACE/project-x86_64.AppImage" \
            --appimage-extract >/dev/null
          
          echo "=== QtQuick ==="
          find squashfs-root -type f | grep -i "QtQuick" | head -100 || true
          
          echo
          echo "=== Controls ==="
          find squashfs-root -type f | grep -i "controls" | head -100 || true
          
          echo
          echo "=== Platform plugins ==="
          find squashfs-root -type f | \
            grep -E "platforms|wayland|xcb" | \
            head -100 || true
          
          echo
          echo "=== Executable ==="
          ls -lh squashfs-root/usr/bin/project

      - name: Verify project AppImage
        shell: bash
        run: |
          rm -rf final-check
          mkdir final-check
          cd final-check
          
          "$GITHUB_WORKSPACE/project-x86_64.AppImage" \
            --appimage-extract >/dev/null
          
          echo "=== Packaged executable ==="
          ls -lh squashfs-root/usr/bin/project
          
          if [ ! -f squashfs-root/usr/bin/project ]; then
            echo "ERROR: project executable is missing!"
            exit 1
          fi
          
          echo
          echo "=== Packaged files ==="
          find squashfs-root/usr -maxdepth 4 -type f | sort

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: project-Linux-AppImage
          path: project-x86_64.AppImage

      - name: Test AppImage
        shell: bash
        run: |
          chmod +x project-x86_64.AppImage
          
          echo "=== AppImage information ==="
          ./project-x86_64.AppImage --appimage-version
          
          echo
          echo "=== Running application ==="
          
          QT_QPA_PLATFORM=xcb \
          timeout 15s \
          ./project-x86_64.AppImage
  
