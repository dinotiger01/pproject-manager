name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: json
        shell: pwsh
        run: |
          vcpkg install nlohmann-json:x64-windows

      - name: Verify json
        shell: pwsh
        run: |
          $header = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include/nlohmann/json.hpp"
          
          if (!(Test-Path $header)) {
            Write-Error "nlohmann/json.hpp was not found at $header"
            exit 1
          }
          
          Write-Host "Found nlohmann/json.hpp"

      - name: Configure CMake
        shell: pwsh
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build/project.exe")) {
            Write-Error "project.exe was not created"
            exit 1
          }

          Write-Host "project.exe found."

      - name: Deploy Qt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Copy-Item "build/project.exe" "release/project.exe"

          windeployqt `
            --release `
            --qmldir "$env:GITHUB_WORKSPACE/QML" `
            "release/project.exe"

      - name: Show release files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse release | Select-Object FullName

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: project-Windows
          path: release/